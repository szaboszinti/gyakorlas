<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> // 2. Készíts egy egyszerű számológép programot, amely két számot és egy műveletet kér be, majd kiírja az eredményt!
let num1 = parseFloat(prompt("Adj meg az első számot:"));
let num2 = parseFloat(prompt("Adj meg a második számot:"));
let operation = prompt("Adj meg egy műveletet (+, -, *, /):");
let result;
switch (operation) {
    case "+":
        result = num1 + num2;
        break;  
    case "-":
        result = num1 - num2;
        break;
    case "*":
        result = num1 * num2;
        break;
    case "/":
        if (num2 !== 0) {
            result = num1 / num2;
        } else {
            alert("Nem lehet nullával osztani!");
            result = "Hiba";
        }
        break;
    default:
        alert("Érvénytelen művelet!");
        result = "Hiba";
}
if (result !== "Hiba") {
    alert("Az eredmény: " + result);
}

  </script>
</body>
</html>
