let number = prompt("Adj meg egy pozitív egész számot:");
let sum = 0;
let folytasd = true;
while (folytasd) {
    if (number > 0) {
        for (let i = 0; i < number.length; i++) {
            sum += parseInt(number[i]);
        }
        folytasd = false;
    }

    else{
        console.log("Csak pozitív egész számot adhatsz meg!");
        number = prompt("Adj meg egy pozitív egész számot:");
    }  
}
